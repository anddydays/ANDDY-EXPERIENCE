<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Camera Cat</title>
<meta name="theme-color" content="#a9bfd8" />
<style>
:root{
  --ink:#f8fbff;
  --muted:rgba(245,250,255,.64);
  --line:rgba(255,255,255,.32);
  --glass:rgba(232,242,255,.14);
  --glass-strong:rgba(230,241,255,.22);
  --shadow:0 28px 80px rgba(20,48,80,.22);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#91a9c4;
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}
body{
  min-height:100svh;
  overflow:hidden;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.75),transparent 24%),
    radial-gradient(circle at 84% 18%,rgba(217,235,255,.7),transparent 30%),
    radial-gradient(circle at 56% 86%,rgba(122,163,209,.48),transparent 40%),
    linear-gradient(135deg,#9fb6ce 0%,#c3d2e3 45%,#86a5c7 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:
    radial-gradient(circle at 25% 30%,rgba(255,255,255,.38),transparent 22%),
    radial-gradient(circle at 75% 42%,rgba(255,255,255,.2),transparent 28%);
  filter:blur(75px);
  animation:floatBg 17s ease-in-out infinite alternate;
}
@keyframes floatBg{
  from{transform:translate3d(-1.5%,-1%,0) scale(1)}
  to{transform:translate3d(2%,1.5%,0) scale(1.05)}
}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:1;height:100svh;padding:16px;display:flex;flex-direction:column;gap:14px}
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.23),rgba(255,255,255,.08));
  border:1px solid var(--line);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.42);
  backdrop-filter:blur(28px) saturate(145%);
  -webkit-backdrop-filter:blur(28px) saturate(145%);
}
.topbar{
  min-height:66px;
  border-radius:28px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:9px 13px 9px 20px;
}
.brand{
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.center-status{
  display:flex;
  gap:8px;
  align-items:center;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  height:34px;
  padding:0 13px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.8);
  font-size:8px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:#effff4;
  box-shadow:0 0 14px rgba(235,255,242,.9);
}
.actions{justify-self:end}
.portfolio{
  display:inline-flex;
  height:36px;
  align-items:center;
  padding:0 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(320px,.58fr);
  gap:14px;
}
.camera-panel,.reaction-panel{
  position:relative;
  min-height:0;
  overflow:hidden;
  border-radius:34px;
}
.camera-panel{
  background:rgba(35,62,91,.42);
}
#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  background:#1c3651;
}
.camera-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,.12),transparent 21%,transparent 72%,rgba(255,255,255,.05)),
    linear-gradient(to top,rgba(26,53,82,.16),transparent 28%);
}
.camera-label{
  position:absolute;
  top:18px;
  left:18px;
  z-index:4;
}
#debugHud{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  z-index:5;
  min-height:38px;
  max-height:118px;
  overflow:auto;
  white-space:pre-wrap;
  color:rgba(248,252,255,.78);
  font:9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:11px 13px;
  border-radius:18px;
  background:rgba(224,239,255,.12);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.reaction-panel{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.reaction-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:36px;
}
.reaction-title,.reaction-note{
  font-size:8px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.reaction-note{color:var(--muted)}
.meme-frame{
  flex:1;
  min-height:0;
  border-radius:27px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.27);
  background:rgba(44,72,101,.15);
  position:relative;
}
#memeImg{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:rgba(35,61,89,.16);
}
.meme-frame::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 24%,transparent 80%,rgba(255,255,255,.04));
}
.bottom-copy{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  padding:0 4px 3px;
}
.bottom-copy h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,4vw,58px);
  line-height:.84;
  letter-spacing:-.055em;
  font-weight:400;
}
.bottom-copy p{
  margin:0;
  max-width:150px;
  text-align:right;
  color:var(--muted);
  font-size:8px;
  line-height:1.45;
  letter-spacing:.12em;
  text-transform:uppercase;
}
@media(max-width:900px){
  body{overflow:auto}
  .shell{height:auto;min-height:100svh}
  .topbar{grid-template-columns:1fr auto}.center-status{display:none}
  .workspace{grid-template-columns:1fr;grid-template-rows:62svh 48svh}
  .camera-panel,.reaction-panel{border-radius:28px}
}
@media(max-width:560px){
  .shell{padding:9px;gap:9px}
  .topbar{min-height:58px;border-radius:22px;padding-left:14px}
  .brand{font-size:8px}
  .portfolio{height:32px;padding:0 11px;font-size:7px}
  .workspace{gap:9px}
  #debugHud{left:12px;right:12px;bottom:12px;font-size:8px}
}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar glass">
    <div class="brand">Camera Cat / Original Detector</div>
    <div class="center-status">
      <span class="pill"><i class="dot"></i>Hand + Face Tracking</span>
      <span class="pill">5 Frame Stabilization</span>
    </div>
    <div class="actions">
      <a class="portfolio" href="https://anddydays.github.io/">Portfolio</a>
    </div>
  </header>

  <main class="workspace">
    <section class="camera-panel glass">
      <!-- IMPORTANT: these exact IDs are required by the original app.js -->
      <video id="video" playsinline muted autoplay></video>
      <div class="camera-overlay"></div>
      <div class="camera-label pill">01 / Camera</div>
      <div id="debugHud">Starting original detector…</div>
    </section>

    <aside class="reaction-panel glass">
      <div class="reaction-head">
        <span class="reaction-title">02 / Cat Reaction</span>
        <span class="reaction-note">Original Memes</span>
      </div>

      <div class="meme-frame">
        <!-- IMPORTANT: this exact ID is required by the original app.js -->
        <img id="memeImg" src="memes/pokercat.jpg" alt="Cat reaction" />
      </div>

      <div class="bottom-copy">
        <h1>Camera<br>Cat.</h1>
        <p>Make a gesture. The original detector chooses the cat.</p>
      </div>
    </aside>
  </main>
</div>

<!-- Keep app.js from the original meowmeowcatcam project beside this index.html -->
<script type="module" src="app.js"></script>
</body>
</html>
